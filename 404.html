<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Overseas Highway</title><style>body{margin:0;font-family:Inter,Arial,sans-serif;background:#f7fbfd;color:#102a43;display:grid;place-items:center;min-height:100vh}.route-loader{text-align:center;padding:24px}.route-loader b{display:block;font-size:18px;margin-bottom:8px}.route-loader span{color:#60758a;font-size:13px}</style></head><body><div class="route-loader"><b>Opening Overseas Highway…</b><span>Please wait a moment.</span></div><script>
(async()=>{const clean=location.pathname.replace(/\/$/,'');const map={'/study':'/study.html','/migration':'/migration.html','/tourism':'/tourism.html','/investment':'/investment.html','/malaysia':'/malaysia.html','/events':'/events.html'};const target=map[clean];if(!target){document.querySelector('.route-loader').innerHTML='<b>Page not found</b><span>Please return to the Overseas Highway homepage.</span>';return}try{const res=await fetch(target,{cache:'no-store'});if(!res.ok)throw new Error();const html=await res.text();document.open();document.write(html);document.close()}catch(e){location.replace(target)}})();
</script></body></html>
